  <!-- Inner White Highlight Ring -->
  <circle cx="250" cy="250" r="118" fill="none" stroke="#E2E8F0" stroke-width="1.5" />
  <!-- Inner Dark Blue/Black Core of the Gear -->
  <circle cx="250" cy="250" r="108" fill="#0A0A0C" stroke="#FFFFFF" stroke-width="2" />

