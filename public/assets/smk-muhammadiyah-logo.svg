<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Text Paths for Curving -->
    <!-- Top Arc for SMK MUHAMMADIYAH (Radius ~158) -->
    <path id="smkArcTop" d="M 85 250 A 165 165 0 0 1 415 250" fill="none" />
    <!-- Bottom Arc for BAWANG - BATANG (Radius ~162) -->
    <path id="smkArcBottom" d="M 418 250 A 168 168 0 0 1 82 250" fill="none" />

    <!-- Glow filters for Atom tech icons -->
    <filter id="atomGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

