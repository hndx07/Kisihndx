  <!-- 2. Arched Text (Pure White, Bold, All Caps) -->
  <!-- SMK MUHAMMADIYAH (Top) -->
  <text fill="#FFFFFF" font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" font-weight="900" font-size="28.5" letter-spacing="2.8" text-anchor="middle">
    <textPath href="#smkArcTop" startOffset="50%">
      SMK MUHAMMADIYAH
    </textPath>
  </text>

  <!-- BAWANG - BATANG (Bottom) -->
  <text fill="#FFFFFF" font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" font-weight="900" font-size="27.5" letter-spacing="3.2" text-anchor="middle">
    <textPath href="#smkArcBottom" startOffset="50%">
      BAWANG - BATANG
    </textPath>
  </text>

  <!-- 3. Left Atom Science/Tech Symbol (at 9 o'clock) -->
  <g transform="translate(68, 250)" filter="url(#atomGlow)">
    <!-- Cyan glow backdrop -->
    <circle cx="0" cy="0" r="16" fill="#2563EB" opacity="0.6" />
    <!-- 3 Orbital Ellipses -->
    <ellipse cx="0" cy="0" rx="19" ry="7" fill="none" stroke="#FFFFFF" stroke-width="1.8" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="19" ry="7" fill="none" stroke="#FFFFFF" stroke-width="1.8" transform="rotate(-30)" />
    <ellipse cx="0" cy="0" rx="19" ry="7" fill="none" stroke="#FFFFFF" stroke-width="1.8" transform="rotate(90)" />
    <!-- Nucleus Circle -->
    <circle cx="0" cy="0" r="6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.2" />
    <!-- Inside Nucleus: USB Trident Technology Icon -->
    <path d="M 0 3.5 L 0 -2.5 M -2.2 -0.5 L 0 1 L 2.2 -0.5 M 0 -3.5 L 0 -2.5" stroke="#FFFFFF" stroke-width="0.8" fill="none" />
    <circle cx="0" cy="-3.8" r="0.8" fill="#FFFFFF" />
    <rect x="-3" y="-2" width="1.5" height="1.5" fill="#FFFFFF" />
    <polygon points="2.8,-2 3.8,-0.5 1.8,-0.5" fill="#FFFFFF" />
  </g>

  <!-- 4. Right Atom Science/Tech Symbol (at 3 o'clock) -->
  <g transform="translate(432, 250)" filter="url(#atomGlow)">
    <!-- Cyan glow backdrop -->
    <circle cx="0" cy="0" r="16" fill="#2563EB" opacity="0.6" />
    <!-- 3 Orbital Ellipses -->
    <ellipse cx="0" cy="0" rx="19" ry="7" fill="none" stroke="#FFFFFF" stroke-width="1.8" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="19" ry="7" fill="none" stroke="#FFFFFF" stroke-width="1.8" transform="rotate(-30)" />
    <ellipse cx="0" cy="0" rx="19" ry="7" fill="none" stroke="#FFFFFF" stroke-width="1.8" transform="rotate(90)" />
    <!-- Nucleus Circle -->
    <circle cx="0" cy="0" r="6" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.2" />
    <!-- Inside Nucleus: USB Trident Technology Icon -->
    <path d="M 0 3.5 L 0 -2.5 M -2.2 -0.5 L 0 1 L 2.2 -0.5 M 0 -3.5 L 0 -2.5" stroke="#FFFFFF" stroke-width="0.8" fill="none" />
    <circle cx="0" cy="-3.8" r="0.8" fill="#FFFFFF" />
    <rect x="-3" y="-2" width="1.5" height="1.5" fill="#FFFFFF" />
    <polygon points="2.8,-2 3.8,-0.5 1.8,-0.5" fill="#FFFFFF" />
  </g>

