  <!-- 7. Base Open Book / Rehal Silhouette with Blue Glowing Highlights -->
  <g transform="translate(250, 312)">
    <!-- Base black shape -->
    <path d="M -64 28 C -42 22, -20 28, 0 15 C 20 28, 42 22, 64 28 L 64 36 C 42 32, 20 38, 0 25 C -20 38, -42 32, -64 36 Z" fill="#000000" />
    <!-- Rehal / Book Stand Curves -->
    <path d="M -58 26 C -50 -5, -42 -22, -28 -28 C -15 -32, -8 -18, -6 16 L 6 16 C 8 -18, 15 -32, 28 -28 C 42 -22, 50 -5, 58 26 Z" fill="#000000" stroke="#000000" stroke-width="2" />
    <!-- Glowing blue/violet inner contour lines of the book/stand -->
    <path d="M -48 24 C -42 -2, -34 -16, -24 -20 C -18 -22, -12 -12, -10 14" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linecap="round" />
